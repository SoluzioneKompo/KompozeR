apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: kompozer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: kompozer/auth-service:latest
          imagePullPolicy: Never
          # Seed the dev user, then start the service (mirrors docker-compose).
          command: ["sh", "-c", "node dist/seed.js && node dist/index.js"]
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mongoRootPassword
            - name: MONGO_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongo-auth:27017/authdb?authSource=admin"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: jwtSecret
            - name: SESSION_TTL_HOURS
              value: "8"
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: kompozer
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
