apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: kompozer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      containers:
        - name: reporting-service
          image: kompozer/reporting-service:latest
          imagePullPolicy: Never
          env:
            - name: REPORTING_PORT
              value: "3007"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mongoRootPassword
            - name: ORDER_MONGO_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongo-order:27017/orderdb?authSource=admin"
          ports:
            - containerPort: 3007
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: kompozer
spec:
  selector:
    app: reporting-service
  ports:
    - port: 3007
      targetPort: 3007
