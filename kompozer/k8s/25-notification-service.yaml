apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: kompozer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: kompozer/notification-service:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3005"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mongoRootPassword
            - name: MONGO_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongo-notification:27017/notificationdb?authSource=admin"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: CART_MONGO_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongo-cart:27017/cartdb?authSource=admin"
            - name: CAD_MONGO_URI
              value: "mongodb://mongo-cad-0.mongo-cad:27017,mongo-cad-1.mongo-cad:27017,mongo-cad-2.mongo-cad:27017/caddb?replicaSet=cadrs"
          ports:
            - containerPort: 3005
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: kompozer
spec:
  selector:
    app: notification-service
  ports:
    - port: 3005
      targetPort: 3005
