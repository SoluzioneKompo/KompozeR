# Single-node MongoDB instances (one per bounded context).
# The CAD database is separate — it runs as a replica set (see 12-mongo-cad-rs.yaml).
# Each instance uses root auth from the shared secret and a 1Gi PVC.

# ── mongo-auth (authdb) ──────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-auth-pvc
  namespace: kompozer
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-auth
  namespace: kompozer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo-auth
  template:
    metadata:
      labels:
        app: mongo-auth
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ["--bind_ip_all"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mongoRootUser
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mongoRootPassword
            - name: MONGO_INITDB_DATABASE
              value: authdb
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-auth-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-auth
  namespace: kompozer
spec:
  selector:
    app: mongo-auth
  ports:
    - port: 27017
      targetPort: 27017
---
