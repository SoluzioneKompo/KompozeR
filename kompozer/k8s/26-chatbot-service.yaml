apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: kompozer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
        - name: chatbot-service
          image: kompozer/chatbot-service:latest
          imagePullPolicy: Never
          env:
            - name: CHATBOT_PORT
              value: "3006"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mongoRootPassword
            - name: CHAT_MONGO_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongo-chat:27017/chatbotdb?authSource=admin"
            - name: CATALOG_BASE_URL
              value: "http://catalog-service:3002"
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mistralApiKey
            - name: MISTRAL_MODEL
              value: "mistral-small-latest"
          ports:
            - containerPort: 3006
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: kompozer
spec:
  selector:
    app: chatbot-service
  ports:
    - port: 3006
      targetPort: 3006
