apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: kompozer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: kompozer/order-service:latest
          imagePullPolicy: Never
          env:
            - name: ORDER_PORT
              value: "3008"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mongoRootPassword
            - name: ORDER_MONGO_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongo-order:27017/orderdb?authSource=admin"
          ports:
            - containerPort: 3008
          readinessProbe:
            tcpSocket:
              port: 3008
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: kompozer
spec:
  selector:
    app: order-service
  ports:
    - port: 3008
      targetPort: 3008
