# Promtail — DaemonSet that tails every pod's container logs on each node and
# ships them to Loki. This is the Kubernetes-native equivalent of the Docker
# socket scraper used by docker-compose.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: kompozer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kompozer-promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kompozer-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kompozer-promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: kompozer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: kompozer
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      # File-based scrape of every kompozer pod log on the node. Deterministic on
      # single-node Minikube; labels (pod, container) are extracted from the path.
      - job_name: kompozer-pods
        static_configs:
          - targets: [localhost]
            labels:
              namespace: kompozer
              __path__: /var/log/pods/kompozer_*/*/*.log
        pipeline_stages:
          - docker: {}
          - regex:
              source: filename
              expression: '/var/log/pods/[^_]+_(?P<pod>[a-z0-9-]+)_[a-f0-9-]{36}/(?P<container>[^/]+)/'
          - labels:
              pod:
              container:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: kompozer
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args: ["-config.file=/etc/promtail/config.yml"]
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: containers-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: containers-logs
          hostPath:
            path: /var/lib/docker/containers
