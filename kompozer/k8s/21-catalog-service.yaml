apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: kompozer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: kompozer/catalog-service:latest
          imagePullPolicy: Never
          # The image CMD already seeds the catalog before starting.
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: mongoRootPassword
            - name: MONGO_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongo-catalog:27017/catalogdb?authSource=admin"
            - name: REDIS_URL
              value: "redis://redis:6379"
          ports:
            - containerPort: 3002
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: kompozer
spec:
  selector:
    app: catalog-service
  ports:
    - port: 3002
      targetPort: 3002
