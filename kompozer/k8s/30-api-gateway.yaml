apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kompozer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: kompozer/api-gateway:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kompozer-secrets
                  key: jwtSecret
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3001"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:3002"
            - name: CAD_SERVICE_URL
              value: "http://cad-service:3003"
            - name: CART_SERVICE_URL
              value: "http://cart-service:3004"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3008"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3005"
            - name: CHATBOT_SERVICE_URL
              value: "http://chatbot-service:3006"
            - name: REPORTING_SERVICE_URL
              value: "http://reporting-service:3007"
            - name: REDIS_URL
              value: "redis://redis:6379"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "75m"
              memory: "96Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
# NodePort exposes the gateway outside the cluster. On Minikube reach it via
# `minikube service api-gateway -n kompozer --url`.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kompozer
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
