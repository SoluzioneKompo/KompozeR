# docker-compose.dev.yml — Ambiente di sviluppo con i soli servizi implementati.
# Avvia: apiGateway (3000), authenticationService (3001), catalogService (3002),
# MongoDB auth (host:27017), MongoDB catalog (host:27018), Redis (host:6379).
#
# Le porte MongoDB sono esposte all'host per permettere la connessione da
# MongoDB Compass durante lo sviluppo.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down -v   # rimuove anche i volumi

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  mongo-auth:
    image: mongo:7
    ports:
      - "27017:27017"          # Compass: mongodb://root:changeme@localhost:27017/?authSource=admin
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: authdb
    volumes:
      - mongo-auth-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://root:changeme@localhost:27017/admin -u root -p changeme | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mongo-catalog:
    image: mongo:7
    ports:
      - "27018:27017"          # Compass: mongodb://root:changeme@localhost:27018/?authSource=admin
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: catalogdb
    volumes:
      - mongo-catalog-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://root:changeme@localhost:27017/admin -u root -p changeme | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mongo-cart:
    image: mongo:7
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: cartdb
    volumes:
      - mongo-cart-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://root:changeme@localhost:27017/admin -u root -p changeme | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mongo-cad:
    image: mongo:7
    ports:
      - "27020:27017"          # Compass: mongodb://root:changeme@localhost:27020/?authSource=admin
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: caddb
    volumes:
      - mongo-cad-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://root:changeme@localhost:27017/admin -u root -p changeme | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mongo-notification:
    image: mongo:7
    ports:
      - "27021:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: notificationdb
    volumes:
      - mongo-notification-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://root:changeme@localhost:27017/admin -u root -p changeme | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mongo-chat:
    image: mongo:7
    ports:
      - "27022:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: chatbotdb
    volumes:
      - mongo-chat-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://root:changeme@localhost:27017/admin -u root -p changeme | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mongo-order:
    image: mongo:7
    ports:
      - "27023:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: orderdb
    volumes:
      - mongo-order-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://root:changeme@localhost:27017/admin -u root -p changeme | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ── Backend ─────────────────────────────────────────────────────────────────

  auth-service:
    build: ./backend/authenticationService
    command: sh -c "node dist/seed.js && node dist/index.js"
    environment:
      PORT: "3001"
      MONGO_URI: "mongodb://root:changeme@mongo-auth:27017/authdb?authSource=admin"
      JWT_SECRET: "kompozer-dev-secret-key-32-chars!!"
      SESSION_TTL_HOURS: "8"
    depends_on:
      mongo-auth:
        condition: service_healthy
    restart: unless-stopped

  catalog-service:
    build: ./backend/catalogService
    environment:
      PORT: "3002"
      MONGO_URI: "mongodb://root:changeme@mongo-catalog:27017/catalogdb?authSource=admin"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      mongo-catalog:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  cart-service:
    build: ./backend/cartService
    environment:
      PORT: "3004"
      MONGO_URI: "mongodb://root:changeme@mongo-cart:27017/cartdb?authSource=admin"
      CATALOG_BASE_URL: "http://catalog-service:3002"
      ORDER_BASE_URL: "http://order-service:3008"
    depends_on:
      mongo-cart:
        condition: service_healthy
      order-service:
        condition: service_started
    restart: unless-stopped

  order-service:
    build: ./backend/orderService
    environment:
      ORDER_PORT: "3008"
      ORDER_MONGO_URI: "mongodb://root:changeme@mongo-order:27017/orderdb?authSource=admin"
    depends_on:
      mongo-order:
        condition: service_healthy
    restart: unless-stopped

  cad-service:
    build: ./backend/cadService
    environment:
      PORT: "3003"
      MONGO_URI: "mongodb://root:changeme@mongo-cad:27017/caddb?authSource=admin"
      CATALOG_BASE_URL: "http://catalog-service:3002"
      CART_BASE_URL: "http://cart-service:3004"
    depends_on:
      mongo-cad:
        condition: service_healthy
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build: ./backend/notificationService
    environment:
      PORT: "3005"
      MONGO_URI: "mongodb://root:changeme@mongo-notification:27017/notificationdb?authSource=admin"
      REDIS_URL: "redis://redis:6379"
      CART_MONGO_URI: "mongodb://root:changeme@mongo-cart:27017/cartdb?authSource=admin"
      CAD_MONGO_URI: "mongodb://root:changeme@mongo-cad:27017/caddb?authSource=admin"
    depends_on:
      mongo-notification:
        condition: service_healthy
      mongo-cart:
        condition: service_healthy
      mongo-cad:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  chatbot-service:
    build: ./backend/chatbotService
    environment:
      CHATBOT_PORT: "3006"
      CHAT_MONGO_URI: "mongodb://root:changeme@mongo-chat:27017/chatbotdb?authSource=admin"
      CATALOG_BASE_URL: "http://catalog-service:3002"
    depends_on:
      mongo-chat:
        condition: service_healthy
      catalog-service:
        condition: service_started
    restart: unless-stopped

  reporting-service:
    build: ./backend/reportingService
    environment:
      REPORTING_PORT: "3007"
      ORDER_MONGO_URI: "mongodb://root:changeme@mongo-order:27017/orderdb?authSource=admin"
    depends_on:
      mongo-order:
        condition: service_healthy
    restart: unless-stopped

  # ── Observability ──────────────────────────────────────────────────────────

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3010:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  # ── API Gateway ──────────────────────────────────────────────────────────────

  api-gateway:
    build: ./backend/apiGateway
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: "kompozer-dev-secret-key-32-chars!!"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      CATALOG_SERVICE_URL: "http://catalog-service:3002"
      CAD_SERVICE_URL: "http://cad-service:3003"
      CART_SERVICE_URL: "http://cart-service:3004"
      ORDER_SERVICE_URL: "http://order-service:3008"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3005"
      CHATBOT_SERVICE_URL: "http://chatbot-service:3006"
      REPORTING_SERVICE_URL: "http://reporting-service:3007"
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      cad-service:
        condition: service_started
      notification-service:
        condition: service_started
      chatbot-service:
        condition: service_started
      reporting-service:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo-auth-data:
  mongo-catalog-data:
  mongo-cart-data:
  mongo-cad-data:
  mongo-notification-data:
  mongo-chat-data:
  mongo-order-data:
  loki-data:
  grafana-data:
