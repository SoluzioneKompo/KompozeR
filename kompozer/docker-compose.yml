services:

  # ── Infrastructure ─────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # ── Backend services ───────────────────────────────────────────
  # MongoDB is hosted on Atlas (all 8 databases, one shared M0 cluster) —
  # connection strings come from *_MONGO_URI in .env, no local Mongo containers.

  api-gateway:
    build: ./backend/apiGateway
    ports: ["${GATEWAY_PORT}:${GATEWAY_PORT}"]
    env_file: .env
    depends_on: [auth-service, cad-service, cart-service, catalog-service, order-service, payment-service, reporting-service, redis]

  auth-service:
    build: ./backend/authenticationService
    env_file: .env
    environment:
      MONGO_URI: ${AUTH_MONGO_URI}
      PORT: ${AUTH_PORT}

  cad-service:
    build: ./backend/cadService
    env_file: .env
    environment:
      CAD_MONGO_URI: ${CAD_MONGO_URI}
      CAD_WRITE_CONCERN: ${CAD_WRITE_CONCERN:-majority}
      CAD_READ_CONCERN: ${CAD_READ_CONCERN:-majority}
      CAD_READ_PREFERENCE: ${CAD_READ_PREFERENCE:-primaryPreferred}
      CAD_CHECKPOINT_INTERVAL_MS: ${CAD_CHECKPOINT_INTERVAL_MS:-10000}
      PORT: ${CAD_PORT}
      CATALOG_BASE_URL: http://catalog-service:${CATALOG_PORT}
      CART_BASE_URL: http://cart-service:${CART_PORT}
    depends_on:
      redis:
        condition: service_started
      catalog-service:
        condition: service_started

  cart-service:
    build: ./backend/cartService
    env_file: .env
    environment:
      MONGO_URI: ${CART_MONGO_URI}
      PORT: ${CART_PORT}
    depends_on: [redis, catalog-service, order-service]

  catalog-service:
    build: ./backend/catalogService
    env_file: .env
    environment:
      MONGO_URI: ${CATALOG_MONGO_URI}
      PORT: ${CATALOG_PORT}
    depends_on: [redis]

  order-service:
    build: ./backend/orderService
    env_file: .env
    environment:
      MONGO_URI: ${ORDER_MONGO_URI}
      PORT: ${ORDER_PORT}
    depends_on: [redis]

  payment-service:
    build: ./backend/paymentService
    env_file: .env
    environment:
      MONGO_URI: ${PAYMENT_MONGO_URI}
      PORT: ${PAYMENT_PORT}
    depends_on: [redis]

  notification-service:
    build: ./backend/notificationService
    env_file: .env
    depends_on: [redis]

  reporting-service:
    build: ./backend/reportingService
    env_file: .env
    depends_on: [cart-service, catalog-service]

  # ── Frontend ───────────────────────────────────────────────────

  frontend:
    build: ./frontend
    ports: ["8080:80", "8443:443"]
    volumes:
      - ./tls:/etc/nginx/tls:ro
    depends_on: [api-gateway]
