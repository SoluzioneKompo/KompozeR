worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Enables WebSocket upgrade forwarding (socket.io) only when requested.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to the API Gateway. The frontend calls "/api/...";
    # the trailing slash on proxy_pass strips the "/api" prefix so the gateway
    # receives the bare route (e.g. /api/cad/x -> /cad/x). WebSocket upgrade is
    # forwarded for socket.io (CAD collab, chatbot, notifications).
    location /api/ {
      proxy_pass http://api-gateway:3000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # SPA fallback: unknown routes are served by the Vue app.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
