worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Enables WebSocket upgrade forwarding (socket.io) only when requested.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Plain HTTP is redirected to HTTPS — this is the public entry point,
  # the browser should never talk to it unencrypted.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cert/key path is fixed on purpose: locally it's the self-signed pair
    # baked into the image (or bind-mounted over it in docker-compose); in
    # k8s it's whatever the mounted Secret provides — a manually-generated
    # self-signed one today, a cert-manager-issued one later once there's a
    # real domain. Nginx config never has to change when that swap happens.
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reverse proxy to the API Gateway. The frontend calls "/api/...";
    # the trailing slash on proxy_pass strips the "/api" prefix so the gateway
    # receives the bare route (e.g. /api/cad/x -> /cad/x). WebSocket upgrade is
    # forwarded for socket.io (CAD collab, notifications).
    location /api/ {
      proxy_pass http://api-gateway:3000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # SPA fallback: unknown routes are served by the Vue app.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
