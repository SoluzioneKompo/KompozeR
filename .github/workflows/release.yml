name: Release KompozeR installer

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: soluzionekompo

jobs:
  build-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api-gateway
            context: kompozer/backend/apiGateway
          - name: auth-service
            context: kompozer/backend/authenticationService
          - name: cad-service
            context: kompozer/backend/cadService
          - name: cart-service
            context: kompozer/backend/cartService
          - name: catalog-service
            context: kompozer/backend/catalogService
          - name: order-service
            context: kompozer/backend/orderService
          - name: payment-service
            context: kompozer/backend/paymentService
          - name: notification-service
            context: kompozer/backend/notificationService
          - name: reporting-service
            context: kompozer/backend/reportingService
          - name: frontend
            context: kompozer/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Scrivi DEVUSER.json (auth-service)
        if: matrix.name == 'auth-service'
        shell: bash
        run: |
          cat > kompozer/backend/authenticationService/DEVUSER.json <<'EOF'
          ${{ secrets.DEVUSER_JSON }}
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kompozer-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kompozer-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kompozer-${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kompozer-${{ matrix.name }}:buildcache,mode=max

  build-installer:
    needs: build-push-images
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepara staging installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\dist | Out-Null
          Copy-Item kompozer\docker-compose.prod.yml installer\dist\docker-compose.prod.yml
          Copy-Item kompozer\.env.example installer\dist\.env
          Copy-Item installer\start.bat installer\dist\start.bat
          Copy-Item installer\stop.bat installer\dist\stop.bat
          Copy-Item installer\autostart.bat installer\dist\autostart.bat

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compila installer
        shell: pwsh
        env:
          KOMPOZER_VERSION: ${{ github.run_number }}.0.0
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss

      - name: Upload kompozer-setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: kompozer-setup
          path: installer\output\kompozer-setup.exe

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: KompozeR ${{ github.run_number }}
          files: installer\output\kompozer-setup.exe
          generate_release_notes: true
